[project]
name = "weightd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "torch>=2.8,<3",
]

[project.scripts]
weightd = "weightd:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires an available NVIDIA CUDA device",
    "integration: cross-process integration tests",
]